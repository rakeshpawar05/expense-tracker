spring.application.name=expense-tracking

# Database Configuration with Environment Overrides and Local Fallbacks
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/expensetracker}
spring.datasource.username=${DATASOURCE_USER:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

frontend.url=${FRONTEND_URL:http://localhost:3000}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=trace

# Server Port
server.port=8080

spring.main.allow-circular-references=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# AI Assistant Configuration (Groq / GPT-OSS)
groq.api.key=${CHATBOT_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=${CHATBOT_MODEL:openai/gpt-oss-20b}
